<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="local.windowTitle">Local music</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body class="has-player-bar">
    <div id="ambient-backdrop" aria-hidden="true">
      <img id="ambient-cover" alt="" />
      <div id="ambient-veil"></div>
    </div>

    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-title" data-tauri-drag-region>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-2 5h-3v5.5a2.5 2.5 0 1 1-2.5-2.5c.57 0 1.08.19 1.5.51V9h4v2z"/></svg>
        <span data-i18n="local.windowTitle" data-tauri-drag-region>Local music</span>
      </div>
      <div class="window-controls">
        <button id="win-min-btn" class="icon-btn sm" data-i18n-label="window.minimize" aria-label="Minimize"><svg class="icon" viewBox="0 0 24 24"><path d="M6 19h12v2H6z"/></svg></button>
        <button id="win-max-btn" class="icon-btn sm" data-i18n-label="window.maximize" aria-label="Maximize"><svg class="icon" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg></button>
        <button id="win-close-btn" class="icon-btn sm window-close" data-i18n-label="window.close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <input type="text" id="search-input" class="input" data-i18n-placeholder="local.search" placeholder="Search your music" spellcheck="false" />
        <button id="clear-search-btn" class="icon-btn sm is-hidden" data-i18n-label="local.clearSearch" aria-label="Clear search"><svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <span id="track-count-badge" class="toolbar-count"></span>
      <button id="rescan-btn" class="btn btn-tonal">
        <svg id="rescan-icon" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span data-i18n="local.rescan">Rescan</span>
      </button>
    </div>

    <div class="list-scroll">
      <div id="loading-state" class="empty-state is-hidden">
        <span class="spinner lg"></span>
        <span id="loading-label" data-i18n="local.scanning">Scanning your music…</span>
      </div>
      <table class="tracks-table is-hidden" id="tracks-table">
        <colgroup>
          <col style="width: 48px" />
          <col />
          <col style="width: 24%" />
          <col style="width: 24%" />
          <col style="width: 72px" />
          <col style="width: 64px" />
        </colgroup>
        <thead>
          <tr>
            <th class="num-col">#</th>
            <th data-i18n="local.col.title">Title</th>
            <th data-i18n="local.col.artist">Artist</th>
            <th data-i18n="local.col.album">Album</th>
            <th data-i18n="local.col.format">Format</th>
            <th class="time-col" data-i18n="local.col.time">Time</th>
          </tr>
        </thead>
        <tbody id="tracks-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span id="empty-state-text" data-i18n="local.empty">No music found in your local music folder</span>
        <button id="scan-now-btn" class="btn btn-filled" data-i18n="local.scanNow">Scan folder</button>
      </div>
    </div>

    <div class="player-bar" id="local-player-bar">
      <div id="local-progress-track" class="player-progress" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-label="local.seek" aria-label="Seek">
        <div id="local-progress-fill" class="player-progress-fill"></div>
      </div>

      <div class="player-controls">
        <button id="prev-track-btn" class="icon-btn" data-i18n-label="player.previous" aria-label="Previous"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button id="play-pause-btn" class="icon-btn play-btn" data-i18n-label="player.play" aria-label="Play">
          <svg id="play-icon" class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="icon is-hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="next-track-btn" class="icon-btn" data-i18n-label="player.next" aria-label="Next"><svg class="icon" viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <span class="player-time"><span id="current-time-text">0:00</span> / <span id="total-time-text">0:00</span></span>
      </div>

      <div class="player-meta">
        <span id="playing-title" class="player-title" data-i18n="local.nothingPlaying">Pick a song to play</span>
        <span id="playing-artist" class="player-subtitle"></span>
      </div>

      <div class="player-volume">
        <button id="volume-icon-btn" class="icon-btn" data-i18n-label="player.mute" aria-label="Mute">
          <svg id="volume-on-icon" class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="volume-off-icon" class="icon is-hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" class="range" data-i18n-label="player.volume" aria-label="Volume" />
      </div>
    </div>

    <audio id="local-audio-element"></audio>
    <script type="module" src="./src/ui/local.ts"></script>
  </body>
</html>
