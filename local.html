<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTMD Local Music Library</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <div class="local-header" data-tauri-drag-region>
      <div style="display: flex; align-items: center; gap: 14px; flex: 1;" data-tauri-drag-region>
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>Local Music Library</span>
        </div>
        <div style="position: relative; flex: 1; max-width: 380px;">
          <input type="text" id="search-input" class="search-box" style="width: 100%; padding-right: 28px;" placeholder="Search title, artist or album..." />
          <button id="clear-search-btn" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; display: none; padding: 2px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <span id="track-count-badge" style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); font-weight: 500;">0 tracks</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="rescan-btn" class="btn-secondary" style="font-size: 12px; padding: 6px 12px;">
          <svg id="rescan-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Rescan</span>
        </button>
        <div class="window-controls">
          <button id="win-min-btn" class="window-btn" title="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8h8"/></svg>
          </button>
          <button id="win-max-btn" class="window-btn" title="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg>
          </button>
          <button id="win-close-btn" class="window-btn close" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m1.5 1.5 7 7m0-7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="tracks-table-container">
      <div id="loading-state" class="empty-state" style="display: none;">Scanning music files...</div>
      <table class="tracks-table" id="tracks-table" style="display: none;">
        <thead>
          <tr>
            <th style="width: 44px; text-align: center;">#</th>
            <th>Title</th>
            <th>Artist</th>
            <th>Album</th>
            <th style="width: 80px;">Format</th>
            <th style="width: 70px; text-align: right;">Time</th>
          </tr>
        </thead>
        <tbody id="tracks-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/></svg>
        <span>No local music files found.</span>
        <button id="scan-now-btn" class="btn-primary" style="font-size: 12px; padding: 6px 14px;">Scan Music Directory</button>
      </div>
    </div>

    <div class="local-player-bar" id="local-player-bar">
      <div class="local-track-info">
        <span id="playing-title" style="font-size: 13px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">No track selected</span>
        <span id="playing-artist" style="font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Offline Local Player</span>
      </div>

      <div class="local-player-center">
        <div class="local-player-controls">
          <button id="prev-track-btn" class="ctrl-btn" title="Previous Track" style="padding: 4px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button id="play-pause-btn" class="ctrl-btn play-btn" style="padding: 8px;" title="Play / Pause">
            <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="next-track-btn" class="ctrl-btn" title="Next Track" style="padding: 4px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; width: 100%; font-size: 10.5px; font-family: var(--font-mono); color: var(--text-muted);">
          <span id="current-time-text" style="width: 32px; text-align: right;">0:00</span>
          <div id="local-progress-track" class="progress-track">
            <div id="local-progress-fill" class="progress-fill"></div>
          </div>
          <span id="total-time-text" style="width: 32px;">0:00</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; min-width: 140px; justify-content: flex-end;">
        <button id="volume-icon-btn" class="ctrl-btn" style="padding: 4px;" title="Mute / Unmute">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" class="preamp-slider" style="width: 70px;" />
      </div>
    </div>

    <audio id="local-audio-element"></audio>
    <script type="module" src="./src/ui/local.ts"></script>
  </body>
</html>
