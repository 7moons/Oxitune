# cargo-deny: advisories, licenses, sources. Run: cargo deny check
# (CI: .github/workflows/ci.yml, job `supply-chain`).

[graph]
all-features = false

[advisories]
# Unmaintained crates we can't drop yet come in through tauri/wry/gtk; they
# are reported, not fatal. Everything with a real vulnerability must be
# fixed or explicitly listed below with the reason it doesn't apply.
unmaintained = "workspace"
ignore = [
    # rustls-webpki 0.102.8 comes only from rumqttc 0.25.1, which uses it for
    # nothing but the `webpki::Error` type in its own error enum. Certificate
    # verification runs through rustls 0.23.45 -> rustls-webpki 0.103.15,
    # which has all four fixes. Drop these once rumqttc bumps the crate.
    { id = "RUSTSEC-2026-0049", reason = "rumqttc links webpki 0.102 only for its error type; verification uses 0.103.15" },
    { id = "RUSTSEC-2026-0098", reason = "same" },
    { id = "RUSTSEC-2026-0099", reason = "same" },
    { id = "RUSTSEC-2026-0104", reason = "same" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    # Oxitune itself.
    "GPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
