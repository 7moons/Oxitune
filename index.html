<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Music Desktop</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span>YTMD</span>
        <span class="brand-badge">Desktop</span>
      </div>
      <button id="open-settings-btn" class="btn-secondary">Settings</button>
    </header>
    <main class="container">
      <div class="settings-grid">
        <div class="setting-card">
          <div class="setting-info">
            <span class="setting-label">YouTube Music Companion Active</span>
            <span class="setting-desc">Integration bridge, MPRIS, Discord RPC, and plugins are running in background.</span>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
