# Publishes GitHub Pages: the Discord "Listen along" landing page (pages/)
# and the in-app updater's files. The repository is private, so release
# assets can't be downloaded without a token; instead this mirrors the
# newest *published* release (drafts and pre-releases are skipped, as
# before) to /updates/, with a latest.json pointing at those copies. The app
# checks every download against the minisign signature in latest.json, made
# with the key built into it, so Pages is only a mirror, never trusted.
# Room codes only ever appear after '#' in the join page's URL, so they never
# reach Pages.
name: pages

on:
  push:
    branches: [main]
    paths: ['pages/**', 'scripts/update-manifest.ts', '.github/workflows/pages.yml']
  # Publishing a release (by hand, from its draft) puts it on Pages.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: join page
        run: |
          mkdir -p site
          cp -R pages/. site/
      - name: updater files from the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::warning::No published release yet; Pages has no updates/latest.json."
            exit 0
          fi
          tmp=$(mktemp -d)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$tmp"
          out="site/updates/$tag"
          files=$(bun scripts/update-manifest.ts "$tmp/latest.json" "$BASE_URL" "$tag" site/updates)
          mkdir -p "$out"
          for f in $files; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir "$out"
          done
          echo "Mirrored $tag:"; ls -la "$out"; cat site/updates/latest.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
