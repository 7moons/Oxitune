name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
# Builds signed installers for Linux and Windows, publishes them to a (draft)
# GitHub Release, and generates the `latest.json` manifest the in-app
# updater polls (see src-tauri/tauri.conf.json -> plugins.updater.endpoints).
on:
  push:
    tags:
      - 'v*'

# Nothing by default; the release job alone may write releases.
permissions: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev build-essential patchelf

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: versions match the tag
        run: bun scripts/versions.ts check ${{ github.ref_name }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YTMD ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version. YTMD will also offer to install it automatically from Settings.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
