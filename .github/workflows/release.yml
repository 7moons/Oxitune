name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
# Builds signed installers for Linux and Windows, publishes them to a (draft)
# GitHub Release, and generates the `latest.json` manifest the in-app
# updater polls (see src-tauri/tauri.conf.json -> plugins.updater.endpoints).
# Or by hand (Actions → Release → Run workflow, version e.g. 0.3.0): that
# release is published at once and then put on GitHub Pages for the updater.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.0 (must match the version in the repo)'
        required: true

# Nothing by default; the release job alone may write releases.
permissions: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: tag and notes
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag="v${INPUT_VERSION#v}"; else tag="${GITHUB_REF_NAME}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          notes=".github/release-notes/$tag.md"
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [ -f "$notes" ]; then cat "$notes"; else echo "See the assets below to download and install this version. Oscilla will also offer to install it automatically."; fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev build-essential patchelf

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: versions match the tag
        run: bun scripts/versions.ts check ${{ steps.meta.outputs.tag }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: 'Oscilla ${{ steps.meta.outputs.tag }}'
          releaseBody: ${{ steps.meta.outputs.body }}
          releaseCommitish: ${{ github.sha }}
          # A tag push makes a draft to publish by hand; a manual run publishes.
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' }}
          prerelease: false
          args: ${{ matrix.args }}

  # A release published by this workflow doesn't trigger other workflows
  # (GitHub's rule for its own token), so put it on Pages from here.
  pages:
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
